<!DOCTYPE html>
<html>
<head>
    <title>OC Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #f8f8f8;
            border-bottom: 1px solid #ddd;
        }
        .logo-section {
            display: flex;
            align-items: center;
        }
        .logo-section img {
            height: 50px;
            margin-right: 10px;
        }
        .logo-title {
            font-size: 15px;
        }
        .control-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn {
            padding: 5px 10px;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
        }
        .btn.active {
            background-color: #4285f4;
            color: white;
        }
        input[type=range] {
            width: 420px;
        }
        #dateLabel {
            font-size: 14px;
        }
        iframe {
            width: 100%;
            height: calc(100vh - 150px); /* space for image container + footer */
            border: none;
        }
        #imageContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 5 px auto 5px auto;
        }
        #locationImage {
            width: auto;
            height: 15px;
            display: none;
            margin-bottom: 2px;
        }
        #productImage {
            width: auto;
            height: 27px;
            display: none;
        }
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #f8f8f8;
            text-align: center;
            padding: 8px;
            font-size: 12px;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-section">
        <img src="static/logo.png" alt="Logo" onerror="this.style.display='none'">
        <div class="logo-title"> Multi-Satellite Ocean Color Visualization Dashboard</div>
    </div>
    <div class="control-section">
        <div id="dateLabel">2025-06-10</div>
        <input type="range" id="slider" min="0" max="6" value="6" list="tickmarks" oninput="updatePlot(this.value)">
        <datalist id="tickmarks">
        <option value="0" label="2025-06-04"></option>
<option value="1"></option>
<option value="2"></option>
<option value="3"></option>
<option value="4"></option>
<option value="5"></option>
<option value="6" label="2025-06-10"></option>
        </datalist>
        <button class="btn active" onclick="setProduct('rgb')">RGB Enhanced</button>
        <button class="btn" onclick="setProduct('chl')">Chlorophyll-A</button>
        <button class="btn" onclick="setProduct('rrs660')">Red Reflectance</button>
    </div>
</header>

<iframe id="plotFrame" src="20250610/20250610_rgb_allsats.html"></iframe>

<!-- New image block -->
<div id="imageContainer">
    <img id="locationImage" src="" />
    <img id="productImage" src="" />
</div>

<footer>
    &copy; AIR Centre, 2025
</footer>

<script>
    const dates = ['20250604', '20250605', '20250606', '20250607', '20250608', '20250609', '20250610'];
    const formattedDates = ['2025-06-04', '2025-06-05', '2025-06-06', '2025-06-07', '2025-06-08', '2025-06-09', '2025-06-10'];
    const slider = document.getElementById('slider');
    const dateLabel = document.getElementById('dateLabel');
    const iframe = document.getElementById('plotFrame');
    const productImage = document.getElementById('productImage');
    const locationImage = document.getElementById('locationImage');
    let currentProduct = 'rgb';

    function updatePlot(index) {
        const date = dates[index];
        dateLabel.textContent = formattedDates[index];
        iframe.src = `${date}/${date}_${currentProduct}_allsats.html`;
    }

    function setProduct(product) {
        currentProduct = product;
        updatePlot(slider.value);

        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.btn[onclick="setProduct('${product}')"]`).classList.add('active');

        // Always show location image
        locationImage.src = 'static/location.png';
        locationImage.style.display = 'block';

        if (product === 'chl') {
            productImage.src = 'static/bar1.png';
            productImage.style.display = 'block';
        } else if (product === 'rrs660') {
            productImage.src = 'static/bar2.png';
            productImage.style.display = 'block';
        } else {
            productImage.src = '';
            productImage.style.display = 'none';
        }
    }

    document.addEventListener('keydown', function(event) {
        if (event.key === 'ArrowRight' && parseInt(slider.value) < dates.length - 1) {
            slider.value = parseInt(slider.value) + 1;
            updatePlot(slider.value);
        } else if (event.key === 'ArrowLeft' && parseInt(slider.value) > 0) {
            slider.value = parseInt(slider.value) - 1;
            updatePlot(slider.value);
        }
    });

    window.onload = () => {
        setProduct('rgb');
    };
</script>

</body>
</html>
